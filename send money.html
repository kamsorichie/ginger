<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Money</title>
    <link rel="stylesheet" href="send money css.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <button type="submit"><a href="index.html" class="back">&lt;</a></button>
            <div>
                <p class="Ginger"><b>Ginger Wallet</b></p>
                <h1>Send Money</h1>
            </div>
        </header>
        <div class="wallet-box">
            <div>
                <h2>Transfer to a wallet</h2>
                <p>The receipent's wallet currency is detected automatically</p>
            </div>
        </div>
        <label>Receipent Email</label>
        <input type="email" placeholder="john@gmail.com" required>
        <label>Amount to Send</label>
        <input type="number" placeholder="0.00" required>
        <p>The amount in your wallet currency</p>
        <button>Get exchange rate</button>
        <div class="recent">
            <h2>Recent Transfers</h2>
            <p>Your latest incoming and outgoing transfers.</p>
        </div>
        <div class="history">
            <h3>No transfers yet</h3>
            <p>your recent transfers will show here</p>
        </div>
    </div>
    
</body>
</html>
