<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="sign up page css.css">
</head>
<body>
     <div class="sign-up-box">
            <h1>Sign Up</h1>

        <form id="sign-up-Form">
            <div class="form-group">
                <label for="username"><b>Username</b></label>
                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >
            </div>
            <div class="form-group">
                <label for="email"><b>Email</b></label>
                <input type="email" placeholder="john@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="password"><b>Password</b></label>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <div class="form-group">
                <label for="password"><b>Confirm password</b></label>
                <input type="password" id="password" placeholder="confirm password">
            </div>
            <div class="checkbox">
                <input type="checkbox" required>
                <p>You thereby agree to our terms and services and policies.</p>  
            </div>

            <button type="submit"><a href="login page.html" class="sign">Sign up</a></button>
        </form>

        <!-- <p class="message" id="message">Welcome back</p> -->
    </div>

       

       

    
</body>
</html>
