<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
        <style>
        * {
            box-sizing: border-box;
        }

        body::before {
            content: "";
            position: fixed;
            align-items: center;
            justify-content: center;
            display: flex;
            min-height: 100vh;
            top: -150px;
            left: -150px;
            width: 500px;
            height: 500px;
            background: #5125ff;
            filter: blur(50px);
            opacity: 0.5;
            z-index: -1;
        }
        .login-box {
            width: 420px;
            max-width: 90%;
            padding: 55px 40px;
            background-color: #240e92;
            border-radius: 15px;
            text-align: center;
            position: relative;
            margin: 0 auto;
            transform: translateY(35px);
        }

        h1 {
            color: #79552f;
            font-size: 32px;
            margin-bottom: 40px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #666;
            margin-bottom: 10px;
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 16px;
            border: 1px solid #ddd;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border: 2px solid #3975e8;
        }

        button {
            width: 100%;
            padding: 16px;
            background-color: #2864e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }
        .log{
            text-decoration: none;
            color: black;
        }
            
        button:hover {
            background-color: #a9aeba;
        }

        .message {   
            margin-top: 25px;
            color: #777;
            font-size: 13px;
        }
        .sign{
            color:black;
        }
        .sign:hover{
           color: #a9aeba; 
        }
        .dont-have{
            color: #79552f;
            font-size: 18px;

        }

        @media (max-width: 480px) {
            .login-box {
                padding: 40px 25px;
            }
        }
    </style>
</head>
<body>
        <div class="login-box">
            <h1>LOGIN</h1>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >
            </div>

            <button type="submit"><a href="index.html" class="log">Login</a></button>
        </form>

        <p class="message" id="message">Welcome back</p>
        <p class="dont-have"><b>Don't have an account?..</b><a href="sign up page.html" class="sign">Sign up</a></p>
    </div>

                    document.getElementById("username").value;

                document.getElementById("message").textContent =
                    "Welcome, " + username + "!";

     -->
</body>
</html>
